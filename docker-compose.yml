services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
      POSTGRES_DB: board
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      # Use the host's network while building: avoids DNS problems in Docker on WSL.
      network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://board:board@db:5432/board
      ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
